# Render Blueprint for the API (ADR-0011, docs/ops/deploy.md).
# Secrets are declared with `sync: false`: Render asks for them when the Blueprint is created and
# keeps them in the service environment. Never put their values in this file.
services:
  - type: web
    name: kelola-kasir-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /livez
    autoDeployTrigger: checksPass
    # Only rebuild when the API can have changed (Render Free: 500 build minutes per month).
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
      ignoredPaths:
        - apps/api/test/**
        - '**/*.md'
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Render's edge is the only proxy in front of the container.
      - key: TRUST_PROXY
        value: '1'
      - key: DB_POOL_MAX
        value: '5'
      # CORS_ORIGINS stays unset: the dashboard calls through the Pages Function proxy (same origin).
      - key: STORAGE_REGION
        value: auto
      # Neon: pooled URL (host contains -pooler) for the app, direct URL for migrations.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: PIN_FINGERPRINT_SECRET
        sync: false
      # Same value as PROXY_SHARED_SECRET in the Cloudflare Pages project.
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        sync: false
