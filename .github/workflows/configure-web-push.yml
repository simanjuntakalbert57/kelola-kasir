name: Configure Web Push

# Creates the VAPID key pair on the VPS (ops/vps/configure-web-push.sh) when it does not exist yet and restarts the API.
# The private key never leaves the VPS and is never printed. Safe to run again: existing keys are kept.
# Rotating keys is intentionally not offered: it would invalidate every browser subscription (docs/ops/runbook.md).
on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configure:
    name: Configure VAPID keys on the VPS
    if: github.repository == 'simanjuntakalbert57/kelola-kasir'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Variable VPS_HOST, VPS_KNOWN_HOSTS and secret VPS_SSH_KEY are required (docs/ops/deploy.md step 6)"; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  BatchMode yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Configure
        run: ssh vps /opt/kelola-kasir/configure-web-push.sh

      - name: Check /healthz from outside
        if: vars.API_HEALTH_URL != ''
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: curl -fsS --max-time 20 --retry 5 --retry-delay 5 --retry-all-errors "$API_HEALTH_URL" | tee /dev/stderr | grep -q '"db":"up"'
