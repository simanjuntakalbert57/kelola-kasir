# Read-only status of the nightly backup on the VPS (ops/vps/backup-status.sh): last run of
# kelola-kasir-backup.service, next timer run, heartbeat configured, newest objects in the bucket. No secrets printed.
# Actions → Backup status → Run workflow.
name: Backup status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: Backup status on the VPS
    if: github.repository == 'simanjuntakalbert57/kelola-kasir'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Variable VPS_HOST, VPS_KNOWN_HOSTS and secret VPS_SSH_KEY are required (docs/ops/deploy.md step 6)"; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  BatchMode yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Backup status
        run: |
          set -o pipefail
          ssh vps /opt/kelola-kasir/backup-status.sh | tee -a "$GITHUB_STEP_SUMMARY"
