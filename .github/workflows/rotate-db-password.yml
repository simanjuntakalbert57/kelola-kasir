# Rotate POSTGRES_PASSWORD on the VPS (ops/vps/rotate-db-password.sh) after it was exposed, e.g. in a screenshot.
# The new value is generated on the VPS and never printed. Afterwards: healthz through Caddy, then one backup run.
# Actions → Rotate database password → Run workflow, type "rotate" to confirm.
name: Rotate database password

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "rotate": the API restarts (a few seconds of downtime).'
        required: true

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rotate:
    name: Rotate POSTGRES_PASSWORD on the VPS
    if: github.repository == 'simanjuntakalbert57/kelola-kasir' && inputs.confirm == 'rotate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Variable VPS_HOST, VPS_KNOWN_HOSTS and secret VPS_SSH_KEY are required (docs/ops/deploy.md step 6)"; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  BatchMode yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Rotate
        run: ssh vps /opt/kelola-kasir/rotate-db-password.sh

      - name: Check /healthz from outside
        if: vars.API_HEALTH_URL != ''
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: curl -fsS --max-time 20 --retry 5 --retry-delay 5 --retry-all-errors "$API_HEALTH_URL" | tee /dev/stderr | grep -q '"db":"up"'

      - name: Run the backup once
        run: ssh vps 'cd /opt/kelola-kasir && ./backup-now.sh'
