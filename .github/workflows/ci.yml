name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI lint (redocly)
        run: pnpm api:lint
      - name: Generated contracts are up to date
        run: pnpm contracts:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  contract:
    name: API contract test (schemathesis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: contract
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:contract@localhost:5432/postgres
      # TEMP: spec is looser than the API (minLength, uuid variant, email); tracked in the bug issue linked from tests/contract/README.md.
      CONTRACT_EXCLUDE_CHECKS: positive_data_acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/contract/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r tests/contract/requirements.txt
      - name: Fuzz the API against docs/api/openapi.yaml
        run: tests/contract/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-report
          path: tests/contract/reports/
          if-no-files-found: ignore

  docker:
    name: VPS stack starts, backs up and restores
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_DIR: ${{ github.workspace }}/.vps
    steps:
      - uses: actions/checkout@v4
      - name: Build apps/api/Dockerfile (the image the deploy workflow pushes)
        run: docker build -f apps/api/Dockerfile -t ghcr.io/simanjuntakalbert57/kelola-kasir-api:ci .
      - name: Stage ops/vps with throwaway secrets
        run: |
          sudo apt-get install -yq age >/dev/null
          ops/vps/stage.sh "$COMPOSE_DIR"
          cd "$COMPOSE_DIR"
          age-keygen -o backups/ci.key 2>/dev/null
          key="$(docker run --rm --entrypoint node ghcr.io/simanjuntakalbert57/kelola-kasir-api:ci -e "const c=require('crypto');process.stdout.write(Buffer.from(c.generateKeyPairSync('ed25519').privateKey.export({type:'pkcs8',format:'pem'})).toString('base64'))")"
          {
            echo "API_DOMAIN=localhost"
            echo "ACME_EMAIL=ci@example.com"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "BACKUP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_PRIVATE_KEY=$key"
            echo "PIN_FINGERPRINT_SECRET=$(openssl rand -hex 24)"
            echo "PROXY_SHARED_SECRET=$(openssl rand -hex 24)"
            echo "AGE_RECIPIENT=$(age-keygen -y backups/ci.key)"
            echo "BACKUP_TARGET=local:/backups"
          } > .env
          echo "API_TAG=ci" > release.env
      - name: Start db, api and caddy; check HTTPS /healthz through Caddy
        working-directory: .vps
        run: |
          ./compose.sh up -d --wait --wait-timeout 180
          # API_DOMAIN=localhost: Caddy serves its internal CA certificate, hence -k.
          curl -kfsS https://localhost/livez
          curl -kfsS https://localhost/healthz | tee /dev/stderr | grep -q '"db":"up"'
          code="$(curl -ksS -o /dev/null -w '%{http_code}' https://localhost/v1/me)"
          [ "$code" = 401 ]
          ./compose.sh logs api | grep -q 'Migrations applied'
          # PostgreSQL must not be reachable from outside the compose network.
          ! timeout 3 bash -c '</dev/tcp/127.0.0.1/5432' 2>/dev/null
      - name: Back up with the read-only role, restore into an empty database, verify
        working-directory: .vps
        run: |
          ./backup-now.sh
          file="$(find backups -name '*.dump.age' | head -n 1)"
          echo "backup: $file ($(wc -c <"$file") bytes)"
          ./compose.sh exec -T db createdb -U kelola_kasir restore_check
          pw="$(sed -n 's/^POSTGRES_PASSWORD=//p' .env)"
          target="postgres://kelola_kasir:${pw}@db:5432/restore_check"
          ./compose.sh --profile backup run --rm -e AGE_IDENTITY_FILE=/backups/ci.key \
            --entrypoint /opt/backup/restore.sh backup "/backups/$(basename "$file")" "$target"
          ./compose.sh --profile backup run --rm --entrypoint /opt/backup/verify-restore.sh backup "$target"
      - if: failure()
        working-directory: .vps
        run: ./compose.sh logs --tail 200 || true

  e2e:
    name: E2E dashboard (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_ADMIN_DATABASE_URL: postgres://postgres:e2e@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # OS packages are installed apart from the browser download and never under `timeout`: killing
      # playwright once left its apt-get child holding the dpkg lock, so every retry failed at once.
      # apt retries slow mirrors and waits for the lock itself; the step timeout is the backstop.
      - name: Install Playwright system dependencies
        timeout-minutes: 15
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "60";\nDPkg::Lock::Timeout "300";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
          pnpm --filter @kelola-kasir/e2e exec playwright install-deps chromium firefox webkit
      # Bounded retries: a stalled CDN download once hung this job for 20 minutes.
      - name: Install Playwright browsers
        run: |
          for attempt in 1 2 3; do
            timeout 240 pnpm --filter @kelola-kasir/e2e exec playwright install chromium firefox webkit && exit 0
            echo "browser install attempt ${attempt} failed or timed out"
          done
          exit 1
      - name: Playwright (chromium, firefox, webkit, mobile viewport)
        run: pnpm --filter @kelola-kasir/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
