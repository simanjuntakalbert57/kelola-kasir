name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI lint (redocly)
        run: pnpm api:lint
      - name: Generated contracts are up to date
        run: pnpm contracts:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  contract:
    name: API contract test (schemathesis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: contract
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:contract@localhost:5432/postgres
      # TEMP: spec is looser than the API (minLength, uuid variant, email); tracked in the bug issue linked from tests/contract/README.md.
      CONTRACT_EXCLUDE_CHECKS: positive_data_acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/contract/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r tests/contract/requirements.txt
      - name: Fuzz the API against docs/api/openapi.yaml
        run: tests/contract/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-report
          path: tests/contract/reports/
          if-no-files-found: ignore

  docker:
    name: API image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build apps/api/Dockerfile (the image Render deploys)
        run: docker build -f apps/api/Dockerfile -t kelola-kasir-api .
      - name: Start it like Render does and check /livez and /healthz
        run: |
          key="$(docker run --rm --entrypoint node kelola-kasir-api -e "const c=require('crypto');process.stdout.write(Buffer.from(c.generateKeyPairSync('ed25519').privateKey.export({type:'pkcs8',format:'pem'})).toString('base64'))")"
          docker run -d --name api --network host \
            -e PORT=10000 -e TRUST_PROXY=1 \
            -e DATABASE_URL=postgres://postgres:smoke@localhost:5432/postgres \
            -e DATABASE_URL_DIRECT=postgres://postgres:smoke@localhost:5432/postgres \
            -e JWT_PRIVATE_KEY="$key" -e PIN_FINGERPRINT_SECRET="$(openssl rand -hex 24)" \
            kelola-kasir-api
          for _ in $(seq 1 30); do curl -fsS http://localhost:10000/livez && break; sleep 2; done
          curl -fsS http://localhost:10000/healthz
          docker logs api 2>&1 | grep -q 'Migrations applied'
      - if: failure()
        run: docker logs api || true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
